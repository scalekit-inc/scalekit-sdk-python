# Vendored from scalekit-sdks-wrapper/tools/release/templates/workflows (generate.py).
# Edit there and run `make release-tool-sync`; do not edit this file in place.
#
# Releases scalekit-sdk-python to PyPI.
#
# Started with a version, by the /sdk or /sdk-release workflow in scalekit-sdks-wrapper after the
# release PR (version bump + CHANGELOG section) has merged, or by a maintainer from the Actions tab:
#
#   validate ──▶ ci (build.yml) ──▶ prepare ──▶ publish [environment: release]
#
# `publish` waits for a human approval on the `release` environment; the person who started the
# run cannot approve it. Registry credentials and the release app key exist only there.
# dry_run=true rehearses everything except tagging and publishing.
#
# The file name (release.yml) and environment (release) are part of the PyPI trusted
# publisher configuration; do not rename either without updating PyPI.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, must match the source and have a CHANGELOG section)"
        required: true
        type: string
      dry_run:
        description: "Rehearse: run every step except tagging and publishing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag and CHANGELOG
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Real releases run from main only; use dry_run on other branches."; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version (X.Y.Z)"; exit 1
          fi
          source_version="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("scalekit/_version.py").read_text()
          print(re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1))
          PY
          )"
          if [ "$source_version" != "$VERSION" ]; then
            echo "::error::Source says $source_version, not $VERSION. Merge the release PR first."; exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists."; exit 1
          fi
          latest="$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not ahead of the latest tag v$latest."; exit 1
          fi
          mkdir -p release-meta
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-meta/section.md
          if [ ! -s release-meta/section.md ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION."; exit 1
            fi
            echo "_Rehearsal: CHANGELOG.md has no section for ${VERSION}._" > release-meta/section.md
          fi
          {
            cat release-meta/section.md
            echo
            echo "### Install / upgrade"
            echo
            echo '```bash'
            cat <<INSTALL
          pip install --upgrade "scalekit-sdk-python==${VERSION}"
          INSTALL
            echo '```'
            if [ -n "$latest" ]; then
              echo
              echo "**Full diff:** https://github.com/${REPO}/compare/v${latest}...v${VERSION}"
            fi
          } > release-meta/notes.md
          cat release-meta/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ inputs.version }}
          path: release-meta/
          if-no-files-found: error
          retention-days: 30

  ci:
    name: ci
    needs: validate
    # Must cover every permission build.yml's jobs request.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/build.yml
    secrets: inherit

  prepare:
    name: prepare
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0" "twine==6.2.0"
          python -m build --outdir dist
          twine check --strict dist/*
          ls dist/*"-${VERSION}.tar.gz" dist/*"-${VERSION}-"*.whl
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [validate, prepare]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/scalekit-sdk-python/${{ inputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta-${{ inputs.version }}
          path: release-meta
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ inputs.version }}
          path: dist
      - name: Release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          existing="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already exists at ${existing}, not ${GITHUB_SHA}"; exit 1
            fi
            echo "${TAG} already exists at ${GITHUB_SHA}; continuing"
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"; exit 0
          fi
          flags=(--verify-tag --title "${TAG}" --notes-file release-meta/notes.md)
          case "${VERSION}" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "${TAG}" --repo "${REPO}" "${flags[@]}"
      - name: Verify on PyPI
        run: |
          for _ in $(seq 1 20); do
            if python3 -m pip download --no-deps --disable-pip-version-check -d /tmp/verify "scalekit-sdk-python==${VERSION}" >/dev/null 2>&1; then
              echo "scalekit-sdk-python ${VERSION} is installable from PyPI"; exit 0
            fi
            sleep 15
          done
          echo "::error::scalekit-sdk-python ${VERSION} not installable from PyPI after 5 minutes"; exit 1
