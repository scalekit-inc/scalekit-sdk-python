# Release configuration read by scripts/release/release.py.
[project]
name = "scalekit-sdk-python"
repo = "scalekit-inc/scalekit-sdk-python"
language = "python"

[[version_files]]
path = "scalekit/_version.py"
pattern = '^__version__ = "(?P<version>[^"]+)"'
count = 1

[release]
install = 'pip install --upgrade "scalekit-sdk-python=={version}"'

[paths]
# Changes here ship to users and need a release-notes fragment.
shipped = ["scalekit/*", "setup.py", "pyproject.toml", "requirements*.txt"]
