kind: added
body: |
  `client.resources.list_user_consents(resource_id, consent_ids=[...])` fetches specific end-user consents by ID, for example to look up the `client_id` needed to revoke a consent. `consent_ids` takes up to 25 distinct IDs in the `usrcnst_<number>` format and takes precedence over `user_ids` and `search`; IDs that do not exist or belong to another resource are omitted from the result.

  ```python
  response = client.resources.list_user_consents(
      "res_123456",
      consent_ids=["usrcnst_102709535608668163", "usrcnst_102709535608668164"],
  )
  for consent in response[0].consents:
      print(consent.id, consent.client_id)
  ```
