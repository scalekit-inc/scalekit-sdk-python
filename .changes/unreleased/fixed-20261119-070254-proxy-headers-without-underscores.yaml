kind: fixed
body: |
  `client.actions.request()` and `client.actions.upload_resumable()` failed with `400 missing Connection_name header` behind proxies and load balancers that drop request headers containing underscores, such as ingress-nginx with default settings. They now also send `X-Scalekit-Connection-Name` and `X-Scalekit-Identifier`, alongside the original `connection_name` and `identifier` headers. The new names need a Scalekit server that accepts them; if you run your own Scalekit server, upgrade it first.
time: '2026-11-19T07:02:54.778600+00:00'
