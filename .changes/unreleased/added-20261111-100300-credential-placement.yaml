kind: added
body: |
  An `AuthField` of a static credential can now send its value in the URL path, the query string or the JSON body instead of an HTTP header. Set `AuthField.placement` to `CredentialPlacement(in_="query", name="token")` (or `"body"`, or `"path"` with a `{{name}}` placeholder in the path of the connector's `proxy_url`, for example `https://api.telegram.org/bot{{bot_token}}`). It applies to the `api_key` field of an `API_KEY` pattern, the `token` field of a `BEARER` pattern and the `username` and `password` fields of a `BASIC` pattern, and the server checks the rules when the connector is created or updated and answers 400 `INVALID_ARGUMENT` ("invalid credential placement: ...") when one is broken. Without a placement nothing changes: the credential goes in a header. A `placement` read back from `list_providers` decodes into the same `CredentialPlacement` and goes back unchanged. The docs of `AuthField.header_name` now list the rules for connectors that send several API keys as several headers (at most 10 headers, the allowed characters, the header names the server reserves, `INVALID_HEADER_CONFIG` and the environments where it is not enabled), and `AuthPattern` now documents the `BASIC` type, which the server accepts on every custom connector. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/main/REFERENCE.md#custom-providers)

  ```python
  from scalekit.actions.types import AuthField, AuthPattern, CredentialPlacement

  AuthPattern(
      type="API_KEY",
      display_name="API Key",
      fields=[
          AuthField(
              field_name="api_key",
              input_type="password",
              required=True,
              placement=CredentialPlacement(in_=CredentialPlacement.QUERY, name="token"),
          )
      ],
  )
  ```
