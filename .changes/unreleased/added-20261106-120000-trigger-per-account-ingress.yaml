kind: added
body: |
  Triggers whose webhook URL is per connected account are now supported. `create_ingress_endpoint`, `get_ingress_endpoint`, `set_signing_secret`, `confirm_signing_secret_rotation` and `generate_signing_secret` on `client.actions.triggers` accept a keyword-only `connected_account_id`, and `TriggerIngressEndpoint` gains `scope` and `connected_account_id`. `AvailableTrigger.ingress_per_account` marks these triggers, and `TriggerSubscribeOutcome.NOT_ATTEMPTED` reports accounts a batch did not try (safe to retry). Leaving `connected_account_id` out keeps acting on the connection's URL.

  ```python
  endpoint = client.actions.triggers.create_ingress_endpoint(
      "conn_123", connected_account_id="ca_456"
  )
  print(endpoint.scope, endpoint.url)  # DeliveryScope.ACCOUNT, https://...
  ```
