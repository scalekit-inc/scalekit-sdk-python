kind: added
body: |
  Custom connectors: both `CreateCustomProviderRequest` and `UpdateCustomProviderRequest` take a request-level `source`, an optional `ConnectorSource` whose only value today is `MCP_SERVER` (leave it unset for an API connector), and `is_mcp` on `AuthPattern` is deprecated (it now emits a `DeprecationWarning`) but still works and is still sent. A `source` that conflicts with an explicit `is_mcp=False` on the pattern raises a validation error naming the pattern. The docstrings now state what the server does: update is a PUT that replaces the connector (omitting `metadata` clears it, `description` and `icon_src` cannot be cleared, the auth type and the connector kind cannot change), delete is refused while the connector has connections, `list_providers` returns built-in providers only unless `provider_type` is `CUSTOM` or `ALL`, and how `display_name` becomes the identifier.

  ```python
  client.actions.providers.create_custom_provider(
      CreateCustomProviderRequest(
          display_name="Acme MCP",
          proxy_url="https://mcp.acme.com/mcp",
          source=ConnectorSource.MCP_SERVER,  # replaces AuthPattern(is_mcp=True)
          auth_patterns=[AuthPattern(type="OAUTH", display_name="Acme OAuth", oauth_config=OAuthConfig())],
      )
  )
  ```
