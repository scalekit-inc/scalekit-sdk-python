kind: fixed
body: |
  The create, delete and list docs of custom connectors now state what the server does; no behaviour changes. `create_custom_provider`: `auth_patterns` is required (leaving it out fails with a validation error on `provider.auth_patterns`, an empty list with `auth patterns cannot be empty`; the SDK checks neither before sending), `NO_AUTH` is listed among the auth types, `proxy_url` is the MCP server URL for an MCP connector and the API base URL for an API connector, `display_name` takes letters, digits and spaces (at most 200) and the identifier is derived from it (`Acme MCP` becomes `ACMEMCP:<environment id>`; pass it as `provider` when creating a connection), only the names of the built-in login providers (Github, Google, Gitlab, Microsoft, LinkedIn, Salesforce, Facebook) are rejected, and a name already in use gets a numbered identifier except for an OpenAPI-sourced connector (409). `update_custom_provider` is a PUT: `description` and `icon_src` cannot be cleared, the auth type and `is_mcp` of a pattern cannot be changed (400 `auth pattern is_mcp cannot be changed`), and an `API_KEY` pattern cannot switch between single-key and multiple-headers mode. `delete_custom_provider`: remove the connected accounts, then the connections, then the provider; it also removes the provider's discovered custom MCP tools. `list_providers` without a provider type returns built-in providers only; pass `ProviderType.CUSTOM` for your own connectors or `ProviderType.ALL` for both.
