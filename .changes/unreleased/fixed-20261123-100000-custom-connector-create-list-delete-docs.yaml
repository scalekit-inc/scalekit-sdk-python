kind: fixed
body: |
  The create, delete and list docs of custom connectors now state what the server does; no behaviour changes. `create_custom_provider`: `auth_patterns` is required (leaving it out and passing an empty list fail the same way, 400 `INVALID_ARGUMENT` with a validation error on `provider.auth_patterns`, because the SDK sends no `auth_patterns` for an empty list; the SDK checks neither before sending), `NO_AUTH` is listed among the auth types, `proxy_url` is the MCP server URL for an MCP connector and the API base URL for an API connector, `display_name` takes ASCII letters, digits and spaces only (1-200 characters, at least one letter or digit) and the identifier is derived from it (`Acme MCP` becomes `ACMEMCP:<environment id>`; pass it as `provider` to `client.actions.create_connection`), only the names of the built-in login providers (Github, Google, Gitlab, Microsoft, LinkedIn, Salesforce, Facebook) are rejected, and a name already in use gets a numbered identifier except for an OpenAPI-sourced connector (409). `update_custom_provider` is a PUT: `description` and `icon_src` cannot be cleared, the auth type and `is_mcp` of a pattern cannot be changed (400 `auth pattern is_mcp cannot be changed`), and an `API_KEY` pattern cannot switch between single-key and multiple-headers mode. `delete_custom_provider`: remove the connected accounts (`client.actions.delete_connected_account`), then the connections (`client.actions.delete_connection`), then the provider; it also removes the provider's discovered custom MCP tools. `list_providers` without a provider type returns built-in providers only; pass `ProviderType.CUSTOM` for your own connectors or `ProviderType.ALL` for both.
