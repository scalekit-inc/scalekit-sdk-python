kind: changed
body: |
  AGENTKIT.md has a new Custom connectors guide for `client.actions.providers`: creating a connector from an OpenAPI spec, following the tool collection run (polling, what a run does, the `a-<connector>_<operation>` tool names, skipped operations and the limits), credentials in a header, changing a connector, using its tools, and the errors. REFERENCE.md documents `create_custom_provider`, `update_custom_provider`, `trigger_tool_collection` and `get_tool_collection_run` with the new arguments and errors, and the update example now reads the connector first, because an update that leaves out `metadata` clears it and one that leaves out `proxy_enabled` turns it off. The `ActionMcp` section says how a virtual MCP server serves a custom connector's tools in `DIRECT` and `META` mode, and which connections a configuration accepts. `OAuthSettings.token_endpoint_auth_method` is documented under AgentKit connections. The docs of `AuthField.header_name` list the rules for sending several API keys as several headers, and `AuthPattern` documents the `BASIC` type. The docs of `list_tools` now say how a custom connector's tools are listed and named (`a-<connector>_<operation>` for a connector created from an OpenAPI spec, `c-<connector>_<tool>` for a custom MCP connector), that `page_size` defaults to 300 and is lowered to 1000 when larger, and that `query` searches global tools only; the docs of `list_scoped_tools` and `execute_tool` cover custom connector tools too. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/main/AGENTKIT.md#custom-connectors)
