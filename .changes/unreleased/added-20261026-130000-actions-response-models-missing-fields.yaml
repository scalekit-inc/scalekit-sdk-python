kind: added
body: |
  `client.actions` responses now include fields the API already returned but the Python models left out. A connected account from `list_connected_accounts` gains `id`, `connection_id` and `is_org_wide_credential`, so you can pass its `id` straight to `get`, `update` and `delete` by connected account id. A connected account from `get_connected_account_auth` gains `connection_id` and `is_org_wide_credential`. A provider from `list_providers` gains `id`, `categories`, `display_priority` and `coming_soon`, and the `list_providers` response gains `prev_page_token` for paging backwards. All new fields have defaults, so existing code keeps working and nothing you read today changes. The `list_providers` documentation now says what it does: with no `provider_type` it returns only the built-in providers, and `ProviderType.ALL` or `ProviderType.CUSTOM` includes your custom providers (it used to say it returns all providers). The `get_magic_link_for_connected_account` example in `AGENTKIT.md` and `REFERENCE.md` now reads the link from `response[0].link`; it used `response[0].magic_link`, which does not exist and raised `AttributeError`. The `request` docs now say that the proxy call times out after 30 seconds by default and that you can pass `timeout=<seconds>` for slower provider calls.
