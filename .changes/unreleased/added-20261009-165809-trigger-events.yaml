kind: added
body: |
  `scalekit.verify_trigger_event(body, headers=..., secret=...)` and `client.actions.triggers.verify_event(...)` verify the signature of a trigger event delivered to your endpoint and return it as a typed `TriggerEvent`; the standalone function needs no client. Any failure raises `WebhookVerificationError`, and a correctly signed body that is not a valid trigger event raises the new subclass `ScalekitTriggerEventParseException`. Delivery is at least once, so deduplicate on `dedupe_key` plus the connected account. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/v2.21.0/AGENTKIT.md#trigger-events)

  ```python
  import os
  from flask import Flask, request
  from scalekit import verify_trigger_event
  from scalekit.common.exceptions import WebhookVerificationError

  app = Flask(__name__)

  @app.post("/triggers")
  def triggers():
      try:  # pass the raw body, before any JSON parsing
          event = verify_trigger_event(request.get_data(), headers=request.headers, secret=os.environ["SCALEKIT_TRIGGER_SECRET"])
      except WebhookVerificationError:  # bad signature, stale timestamp or malformed event
          return "", 400
      enqueue(event)  # your handler: deduplicate on event.dedupe_key + the connected account
      return "", 204
  ```
