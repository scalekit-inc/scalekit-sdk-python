kind: added
body: |
  Generated code is synced to proto `v0.1.162.1`. `client.actions.create_connected_account()`, `update_connected_account()` and `get_or_create_connected_account()` / `upsert_connected_account()` accept an optional `authorization_details["oauth_token"]["expires_at"]`: a timezone-aware `datetime`, sent as UTC. A naive `datetime` raises `ValueError` and any other type raises `TypeError`; leave it out or pass `None` to send nothing, as before. It is read only when you import a token obtained outside Scalekit for a connection that uses your own OAuth app: the account becomes `ACTIVE` and its `token_expires_at` is set to `expires_at`. Without it, the account has no token expiry and the token is used until the provider rejects it; if a `refresh_token` was imported, tool calls then refresh and retry automatically, and proxy callers refresh with the refresh connected account tokens API. Without a `refresh_token`, nothing can be refreshed, and the account must be updated with new tokens or authorized again. To correct the expiry of the current token, update the account with the same `access_token` and the new `expires_at`; the account status does not change. `expires_at` is never returned; read the expiry back from the account's `token_expires_at`. `AuthState` gains `AUTHENTICATION_NOT_RESUMABLE`.
