kind: added
body: |
  Generated code is synced to proto `v0.1.162.1`. `client.actions.create_connected_account()`, `update_connected_account()` and `get_or_create_connected_account()` / `upsert_connected_account()` accept an optional `authorization_details["oauth_token"]["expires_at"]`: a timezone-aware `datetime`, an RFC 3339 string (`"2026-12-01T10:00:00Z"` or with an offset), or epoch seconds as an int or float. A naive `datetime` or an unparseable value raises `ValueError`; leave it out or pass `None` to send nothing, as before. It is only used when you import a token obtained outside Scalekit for a connection that uses your own OAuth app: the account becomes `ACTIVE` and Scalekit records `expires_at` as the token's expiry. Without it, a token imported with a `refresh_token` is refreshed on first use, and one without is used until the provider rejects it. `expires_at` is not returned when reading the account. The provider messages (`Provider`, `CreateProvider`, `UpdateProvider`) gain an `allowed_hosts` field, and `AuthState` gains `AUTHENTICATION_NOT_RESUMABLE`.
time: '2026-11-11T12:00:00.000000+00:00'
