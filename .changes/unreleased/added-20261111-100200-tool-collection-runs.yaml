kind: added
body: |
  `client.actions.invoke_tool_collection(provider_identifier)` and `client.actions.get_tool_collection_run(provider_identifier, run_id="latest")` follow the tool generation of an OpenAPI-sourced connector. `provider_identifier` is the connector's identifier (`NAME:environment-id`, from `provider.identifier`), not `provider.id`. Both take plain keyword arguments; the same operations are also available as `client.actions.providers.invoke_tool_collection(request)` and `client.actions.providers.get_tool_collection_run(request)`, which take an `InvokeToolCollectionRequest` and a `GetToolCollectionRunRequest`. A connector created with `openapi_spec_url` gets its tools from a background run; `get_tool_collection_run` with `run_id="latest"` (the default) reads the newest run, and `invoke_tool_collection` queues a new one, for example to pick up changes to the spec or to retry a failed run. Both return a typed, frozen `ToolCollectionRun` with `status` (`ToolCollectionRunStatus.QUEUED`, `PROCESSING`, `COMPLETED` or `FAILED`), `is_terminal`, the counters `total_endpoints`, `tools_created`, `tools_updated` and `tools_deleted`, `error_message`, timezone-aware `created_at`, `started_at` and `finished_at`, and `skipped_tools`, the operations that could not become tools as `SkippedTool` entries with `operation_id`, `method`, `path` and `reason`. A connector has one active run at a time, so an invocation while one is queued or running raises `ScalekitConflictException`. The server queues the first run in the background after `create_custom_provider` has answered, so `get_tool_collection_run` can raise `ScalekitNotFoundException` (404) until that run exists. `skipped_tools` is a tuple, so a run cannot be changed through it. The whitespace around `provider_identifier` and `run_id` is removed, and a blank `run_id` means `latest`. The server gives up queueing the first run after 30 seconds without reporting it, so call `invoke_tool_collection` once when `get_tool_collection_run` still answers 404 after that. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/main/REFERENCE.md#custom-providers)

  ```python
  from scalekit import ScalekitClient

  scalekit_client = ScalekitClient(env_url, client_id, client_secret)

  run = scalekit_client.actions.invoke_tool_collection(provider_identifier="ACMEAPI:70219645518265104")
  run = scalekit_client.actions.get_tool_collection_run(provider_identifier="ACMEAPI:70219645518265104", run_id=run.run_id)
  print(run.status, run.is_terminal, run.tools_created, len(run.skipped_tools))
  ```
