kind: added
body: |
  `client.actions.mcp.create_session_token(connection_name=..., identifier=...)` mints a session token for a connection's own MCP server (`<environment URL>/mcp/v3/connections/<connection name>`), which serves all of that connection's tools without an MCP configuration. Pass exactly one of `mcp_config_id` or the new keyword-only `connection_name`; `expiry` and `access_level` work for both, and `access_level="READ_ONLY"` limits the token to read-only tools. The URL path is case-sensitive, so connect with the connection's name exactly as stored. Existing calls with `mcp_config_id`, positional or keyword, are unchanged. `client.mcp.create_session_token` takes the same arguments and returns the raw `(response, call)` tuple. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/main/AGENTKIT.md#mcp-mcpclient)

  ```python
  from datetime import timedelta

  resp = client.actions.mcp.create_session_token(
      connection_name="gmail",
      identifier="user_123",
      expiry=timedelta(minutes=15),
      access_level="READ_ONLY",
  )
  headers = {"Authorization": f"Bearer {resp.token}"}
  ```
