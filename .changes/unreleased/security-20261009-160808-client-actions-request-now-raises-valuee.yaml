kind: security
body: |
  `client.actions.request()` now raises `ValueError`, before sending anything, when `path` would resolve outside the proxy prefix. Previously, a `path` containing `..` segments, including percent-encoded or backslash forms, could reach other endpoints on the environment host with the client's credentials. Every other path is sent unchanged. Affects 2.5.0 through 2.20.0. Upgrade if you build `path` from untrusted input.
