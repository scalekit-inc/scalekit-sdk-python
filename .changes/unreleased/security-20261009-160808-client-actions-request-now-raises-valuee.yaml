kind: security
body: |
  `client.actions.request()` no longer sends the client's credentials outside the proxy prefix. A `path` that the server would resolve outside the prefix now raises `ValueError` before anything is sent: for example one with `..` segments in literal, percent-encoded or backslash form, or one that does not begin with `/` or `%2F`. If a proxied response redirects outside the proxy prefix, the redirect is still followed, but without the bearer token or the `connection_name` and `identifier` headers. Every other path and redirect behaves as before. Affected versions: `>=2.4.17, <2.20.1`. Fixed in 2.20.1. Upgrade if you build `path` from untrusted input or call APIs that can redirect.
