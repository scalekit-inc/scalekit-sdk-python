kind: fixed
body: |
  `client.actions.get_connected_account()`, `list_connected_accounts()` and `get_authorization_link()` returned `1970-01-01T00:00:00` for a timestamp the server left unset, such as the `token_expires_at` of an account whose imported OAuth token has no expiry. They now return `None`, so `token_expires_at is None` means the account has no token expiry. Timestamps that are set are unchanged.
