kind: changed
body: |
  The docs of `client.connection.update_environment_connection` now explain how to set the token endpoint auth type of an OAuth connection with `UpdateConnection.oauth_config.token_endpoint_auth_type`: `TokenAuthType.BASIC_AUTH` sends the client credentials in an HTTP Basic header, `URL_PARAMS` sends them as POST body parameters, and `NONE` is for public (PKCE) clients: it sends no client secret on an MCP token refresh, and on the authorization_code exchange only when the connection has no client secret stored (a stored secret is still sent), while `OAUTH_M2M` client_credentials treats it like `BASIC_AUTH`. Leave the field unset to keep the stored value, and send `TOKEN_AUTH_TYPE_UNSPECIFIED` to reset it to the Default. Set it only on a connection of a custom MCP or OpenAPI-sourced connector whose token endpoint documentation requires a specific method, because a wrong value makes new authorizations fail and, on an MCP or `OAUTH_M2M` connection, token refresh too, so those connected accounts have to authenticate again. It can only be set by an update, because `CreateConnection` carries no OAuth settings. The string field `token_endpoint_auth_method` is deprecated, and the docs say how the two fields interact. The docs of `create_environment_connection` and `get_environment_connection` now cover `CreateConnection.context`, which resolves a templated MCP connector `proxy_url` (`{{domain}}`, `{{version}}`) once, when the connection is created, and `connection.resolved_proxy_url`, which reports the result. `TokenEndpointAuthMethod`, the setting of `client.actions.update_connection`, now documents what each value sends. [Reference](https://github.com/scalekit-inc/scalekit-sdk-python/blob/main/REFERENCE.md#connection)

  ```python
  from google.protobuf import struct_pb2
  from scalekit.v1.connections.connections_pb2 import (
      ConnectionType, CreateConnection, OAuthConnectionConfig, TokenAuthType, UpdateConnection,
  )

  client.connection.update_environment_connection(
      "conn_123",
      UpdateConnection(
          provider_key="prv_abc123",  # Provider.identifier of the custom connector
          key_id="acme-mcp",
          type=ConnectionType.OAUTH,
          oauth_config=OAuthConnectionConfig(token_endpoint_auth_type=TokenAuthType.NONE),
      ),
  )

  context = struct_pb2.Struct()
  context.update({"domain": "mcp-eu.example.com"})
  response = client.connection.create_environment_connection(
      CreateConnection(provider_key="prv_abc123", type=ConnectionType.OAUTH, context=context)
  )
  print(response[0].connection.resolved_proxy_url)
  ```
